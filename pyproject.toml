[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gene-network-analysis"
version = "0.1.0"
description = "Regulator ranking pipelines for gene regulatory networks"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4", "scikit-learn>=1.5,<2"]

[project.scripts]
gene-network-analysis = "gene_network_analysis.cli:main"

[dependency-groups]
dev = ["ruff>=0.11"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
